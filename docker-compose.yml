name: devdigest

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdigest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_PASSWORD: devdigest
      POSTGRES_DB: devdigest
    ports:
      # Loopback only: a bare "5432:5432" binds every interface, putting a
      # dev DB with well-known creds on the LAN. Node's Happy Eyeballs still
      # resolves `localhost` (::1 first) down to 127.0.0.1, so the API's
      # DATABASE_URL keeps working unchanged.
      - "127.0.0.1:5432:5432"
    volumes:
      - devdigest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdigest_pgdata:
    name: devdigest_pgdata
